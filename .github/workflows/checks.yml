name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  logic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0.3"
      - name: Logic tests and repo audit
        run: bash ios/Scripts/check.sh
